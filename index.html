window.onerror = function(msg, src, line, col, err) {
  // "Script error" without details = cross-origin script, ignore
  if (!msg || msg === 'Script error.' || msg === 'Script error') return true;
  var d = document.getElementById('dbg');
  if (d) { d.style.display = 'block'; d.textContent = 'ERR line ' + line + ': ' + msg; }
  return true;
};

window.addEventListener('load', function() {

setTimeout(function() {
  try { initGame(); } catch(e) {
    var d = document.getElementById('dbg');
    if (d) { d.style.display='block'; d.textContent='ERR: '+e.message+'\n'+(e.stack||'').slice(0,300); }

function initGame() {

// Вспомогательная функция: hex строка '#rrggbb' → число для Pixi
function c2n(hex) {
  if (typeof hex === 'number') return hex;
  return parseInt((hex || '#888888').replace('#', ''), 16);

// ── Pixi слои ──────────────────────────────────────────────
var worldContainer = new PIXI.Container(); // весь мир (масштаб + камера)

var bgGfx    = new PIXI.Graphics(); // фон — статичный, рисуется один раз
var worldGfx = new PIXI.Graphics(); // динамика мира — очищается каждый кадр
worldContainer.addChild(bgGfx);
worldContainer.addChild(worldGfx);

var hudGfx = new PIXI.Graphics();   // линии/прямоугольники HUD
hudContainer.addChild(hudGfx);

// HUD текст — создаём один раз, обновляем каждый кадр
var txtStyle = { fontFamily: 'monospace', fontSize: 13, fill: 0x4488ff };
var hudTxtBlue  = new PIXI.Text('', Object.assign({}, txtStyle, { fill: 0x4488ff }));

var hudTxtHint  = new PIXI.Text('', Object.assign({}, txtStyle, { fontSize: 11, fill: 0xffffff }));
var hudTxtOver1 = new PIXI.Text('', Object.assign({}, txtStyle, { fontSize: 26, fontWeight: 'bold', fill: 0x4488ff }));

hudTxtOver1.anchor.set(0.5);

hudContainer.addChild(hudTxtVs);
hudContainer.addChild(hudTxtHint);
hudContainer.addChild(hudTxtOver1);
hudContainer.addChild(hudTxtOver2);
hudContainer.addChild(hudTxtFps);

// Текстовый пул для меток юнитов в мировом пространстве
var _txtPool = [], _txtPoolIdx = 0;
function _getWorldText() {
  if (_txtPoolIdx < _txtPool.length) {
    var t = _txtPool[_txtPoolIdx++]; t.visible = true; return t;
  }
  var t = new PIXI.Text('', { fontFamily: 'sans-serif', fontSize: 11, fill: 0xffffff });
  t.anchor.set(0.5, 0.5);
  worldContainer.addChild(t);
  _txtPool.push(t); _txtPoolIdx++;
  return t;
}
function _resetWorldText() {
  _txtPoolIdx = 0;
  for (var _i = 0; _i < _txtPool.length; _i++) _txtPool[_i].visible = false;
}

// Мировые координаты — карта больше экрана
var MAP_W = 1600, MAP_H = 1200;

// Масштаб: < 1 = больше мира видно на экране
var ZOOM = 0.72;

// Камера
var camX = 0, camY = 0;
var camTargetX = 0, camTargetY = 0;

var SPEED       = 2.2;
var SEP         = 30;
var FIGHT_RANGE = 5;
var ROUND_TIME  = 0.4;
var REGEN_RATE  = 0.25;
var ATK_DMG     = 1;
var STUN_RATIO  = 0.5;
var SPAWN_TIME    = 5;   // задержка перед первым респауном после смерти
var CAMP_CAPACITY = 5;   // юнитов на лагерь
var GLOBAL_LIMIT  = 50;  // максимум живых юнитов на карте

// ── Стамина / заряд ─────────────────────────────────────────
var CHARGE_SPEED   = SPEED * 1.75;
var STAMINA_MAX    = 100;
var STAMINA_DRAIN  = 20;  // /сек при заряде
var STAMINA_REGEN  = 9;   // /сек в покое
var CHARGE_DIST_T1 = 55;  // тир 1 → +25% урон
var CHARGE_DIST_T2 = 130; // тир 2 → +55% урон
var CHARGE_DIST_T3 = 220; // тир 3 → +90% урон + stun 0.4с
// Глобальный флаг заряда для team 0 (игрок)
// палец на экране / кнопка зажата = заряд, убрал = марш
// playerCharging удалён — заменён на playerSprint[] (двойной тап)

// team: 0=синий, 1=красный, 2=нейтрал
var TEAM_COLOR = ['#4488ff', '#ff4444', '#aaaaaa'];
var TEAM_DARK  = ['#1133aa', '#aa1111', '#555555'];

// ── Spatial grid ───────────────────────────────────────────
var GRID_CELL = 64;
var GRID_COLS = Math.ceil(MAP_W / GRID_CELL);
var GRID_ROWS = Math.ceil(MAP_H / GRID_CELL);
var spatialGrid = new Array(GRID_COLS * GRID_ROWS);
function buildGrid() {
  for (var _i = 0; _i < spatialGrid.length; _i++) spatialGrid[_i] = null;
  for (var _j = 0; _j < units.length; _j++) {
    var _u = units[_j];
    if (!_u.alive) continue;
    var _cx = Math.floor(_u.x / GRID_CELL); if (_cx < 0) _cx = 0; if (_cx >= GRID_COLS) _cx = GRID_COLS-1;
    var _cy = Math.floor(_u.y / GRID_CELL); if (_cy < 0) _cy = 0; if (_cy >= GRID_ROWS) _cy = GRID_ROWS-1;
    var _idx = _cy * GRID_COLS + _cx;
    _u._next = spatialGrid[_idx];
    spatialGrid[_idx] = _u;
  }
}
function forNearby(x, y, r, fn) {
  var mnX = Math.floor((x-r)/GRID_CELL); if (mnX<0) mnX=0;
  var mxX = Math.floor((x+r)/GRID_CELL); if (mxX>=GRID_COLS) mxX=GRID_COLS-1;
  var mnY = Math.floor((y-r)/GRID_CELL); if (mnY<0) mnY=0;
  var mxY = Math.floor((y+r)/GRID_CELL); if (mxY>=GRID_ROWS) mxY=GRID_ROWS-1;
  for (var _cy2=mnY; _cy2<=mxY; _cy2++) {
    for (var _cx2=mnX; _cx2<=mxX; _cx2++) {
      var _u2=spatialGrid[_cy2*GRID_COLS+_cx2];
      while(_u2){fn(_u2);_u2=_u2._next;}
    }
  }
}

// ── Color helpers ──────────────────────────────────────────
function hexToRgb(hex) {
  if (!hex) return [128,128,128];
  // поддерживаем '#rrggbb' и 'rgb(r,g,b)'
  if (hex[0] === '#') {
    return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
  }
  var m = hex.match(/rgb\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)/);
  return m ? [+m[1],+m[2],+m[3]] : [128,128,128];
}
function lerpColor(hexA, hexB, t) {
  var a = hexToRgb(hexA), b = hexToRgb(hexB);
  var r = Math.round(a[0]+(b[0]-a[0])*t);
  var g = Math.round(a[1]+(b[1]-a[1])*t);
  var bl= Math.round(a[2]+(b[2]-a[2])*t);
  // возвращаем как hex-строку чтобы c2n тоже мог использовать
  return '#' + ('0'+r.toString(16)).slice(-2) + ('0'+g.toString(16)).slice(-2) + ('0'+bl.toString(16)).slice(-2);
}

var CAMP_POS = [
  { x: MAP_W*0.5,  y: MAP_H*0.5  },   // центр
  { x: MAP_W*0.25, y: MAP_H*0.3  },   // лево-верх
  { x: MAP_W*0.75, y: MAP_H*0.3  },   // право-верх
  { x: MAP_W*0.25, y: MAP_H*0.7  },   // лево-низ
  { x: MAP_W*0.75, y: MAP_H*0.7  },   // право-низ
  { x: MAP_W*0.5,  y: MAP_H*0.2  },   // верх-центр
  { x: MAP_W*0.5,  y: MAP_H*0.8  },   // низ-центр
];

// ── Unit factory ───────────────────────────────────────────
function makeUnit(x, y, team, group, isSmall) {
  return {
    x, y, vx: 0, vy: 0,
    hp: isSmall ? 2.1 : 3,
    maxHp: isSmall ? 2.1 : 3,
    atk: isSmall ? 0.25 : ATK_DMG,
    team, group,
    radius: isSmall ? 9 : 14,
    isSmall: !!isSmall,
    alive: true,
    retreating: false,
    fighters: [],
    attacking: null,
    fightTimer: 0,
    regenTimer: 0,
    flashTimer: 0,
    shakeX: 0, shakeY: 0,
    stunTimer: 0,
    retreatBlocked: false,
    campGuard: null, isNeutral: false, homecamp: null, waiting: false,
    growTimer: 0, growFrom: 0, growDuration: 0,
    colorTimer: 0, colorFrom: -1, colorDuration: 0,
    blockTimer: 0, outnumberedRounds: 0,
    stamina: STAMINA_MAX, chargeDist: 0,
    fearStack: 0, fearStackTimer: 3,
    fearBurst: false, fearBurstTimer: 0,
    recentDeathTimes: [], fearPanicTimer: 0,
    wavering: false, waveringTimer: 0, waveringCourage: 0, _waveringCaptor: null,
    waveringHit: false, _next: null,
  };
}

// ── Camps ──────────────────────────────────────────────────
var camps = [];
var units = [];
// Кэшированные счётчики — обновляем при рождении/смерти/захвате
var aliveCount = 0;          // всего живых юнитов
var teamAlive  = [0, 0, 0];  // по командам
var teamCamps  = [0, 0];     // лагеря по командам

function makeCamps() {
  var my = MAP_H / 2;
  camps = [];
  teamCamps[0] = teamCamps[1] = 0;
  // Домашние базы команд (изначально захвачены)
  camps.push({ x: 80,       y: my, team: 0, radius: 22, capacity: CAMP_CAPACITY, pending: CAMP_CAPACITY, spawnTimer: 0, isBase: true });
  camps.push({ x: MAP_W-80, y: my, team: 1, radius: 22, capacity: CAMP_CAPACITY, pending: CAMP_CAPACITY, spawnTimer: 0, isBase: true });
  teamCamps[0]++; teamCamps[1]++;
  // Нейтральные лагеря
  CAMP_POS.forEach(function(p) {
    camps.push({ x: p.x, y: p.y, team: -1, radius: 18, capacity: CAMP_CAPACITY, pending: 0, spawnTimer: 0 });
  });
}

function spawnNeutralGuards(camp) {
  var offsets = [{ x: -14, y: -10 }, { x: 14, y: 10 }];
  offsets.forEach(function(off) {
    var g = makeUnit(camp.x + off.x, camp.y + off.y, 2, 0, true);
    g.campGuard = camp;
    g.isNeutral = true;
    g.homecamp  = camp;
    units.push(g);
    aliveCount++; teamAlive[2]++;
  });
}

function spawnCampUnit(camp, doWait) {
  // Глобальный лимит — используем кэш, не перебираем массив
  if (aliveCount >= GLOBAL_LIMIT) return false;
  var nx = camp.x + (Math.random() - 0.5) * 30;
  var ny = camp.y + (Math.random() - 0.5) * 30;
  var g = makeUnit(nx, ny, camp.team, 0);
  g.homecamp = camp;
  g.waiting = !!doWait;  // подкрепления ждут у лагеря, начальная армия — нет
  units.push(g);
  aliveCount++; teamAlive[camp.team]++;
  if (units.length > 500) units = units.filter(function(u) { return u.alive; });
  return true;
}

function capturecamp(camp, team) {
  if (camp.team >= 0) teamCamps[camp.team]--;
  camp.team = team;
  if (camp.team >= 0) teamCamps[camp.team]++;
  camp.pending = camp.capacity; // очередь на спавн полного отряда
  camp.spawnTimer = 1;          // первый боец через 1 сек
}

function updateCamps(dt) {
  camps.forEach(function(camp) {
    // Нейтральный лагерь: охранники убиты → захват
    if (camp.team === -1) {
      var hasNeutral = false;
      forNearby(camp.x, camp.y, camp.radius + 20, function(_u) {
        if (_u.alive && _u.homecamp === camp && _u.isNeutral) hasNeutral = true;
      });
      if (!hasNeutral) {
        var captor = null;
        forNearby(camp.x, camp.y, camp.radius + 30, function(_u) {
          if (!captor && _u.alive && !_u.isNeutral && _u.team !== 2 &&
              Math.hypot(_u.x - camp.x, _u.y - camp.y) < camp.radius + 30) captor = _u;
        });
        if (captor) capturecamp(camp, captor.team);
      }
      return;
    }

    // Захваченный лагерь: уязвим если нет дружественных юнитов рядом
    var friendNear = false;
    forNearby(camp.x, camp.y, camp.radius + 50, function(_f) {
      if (_f.alive && _f.team === camp.team) friendNear = true;
    });
    if (!friendNear) {
      var enemy = null;
      forNearby(camp.x, camp.y, camp.radius + 30, function(_e) {
        if (!enemy && _e.alive && _e.team !== camp.team && _e.team !== 2 &&
            Math.hypot(_e.x - camp.x, _e.y - camp.y) < camp.radius + 30) enemy = _e;
      });
      if (enemy) { capturecamp(camp, enemy.team); return; }
    }

    // Спавн из очереди
    if (camp.pending > 0) {
      camp.spawnTimer -= dt;
      if (camp.spawnTimer <= 0) {
        if (spawnCampUnit(camp, true)) { // подкрепление — ждёт у лагеря
          camp.pending--;
          camp.spawnTimer = camp.pending > 0 ? 5 : 0; // 5с между бойцами в партии
        } else {
          camp.spawnTimer = 3; // глобальный лимит — подождём
        }
      }
    }
  });
}

// ── Init ───────────────────────────────────────────────────
function initUnits() {
  var my = MAP_H / 2;
  units = [];
  aliveCount = 0; teamAlive[0] = 0; teamAlive[1] = 0; teamAlive[2] = 0;
  // Нейтральные лагеря получают охранников
  camps.forEach(function(c) { if (c.team === -1) spawnNeutralGuards(c); });
  // Домашние базы сразу спавнят своих бойцов
  camps.forEach(function(c) {
    if (c.team >= 0) {
      for (var _i = 0; _i < c.capacity; _i++) spawnCampUnit(c);
      c.pending = 0;
    }
  });
  // Камера стартует у синих
  camX = camTargetX = 0;
  camY = camTargetY = Math.max(0, my - H / 2);
}

var targets = [
  [{ x: 80,        y: MAP_H/2 }, { x: 80,        y: MAP_H/2 }],
  [{ x: MAP_W-80,  y: MAP_H/2 }, { x: MAP_W-80,  y: MAP_H/2 }],
];
var groupRetreating = [[false, false], [false, false]];
var isSplit = false;
var gameOver = null;

// Переключение командования — когда армия игрока уничтожена
var playerRespawnCamp = null;   // лагерь, откуда игрок командует резервом
var playerRespawnMsg  = '';     // сообщение на экране
var playerRespawnMsgTimer = 0;

makeCamps();
initUnits();

// ── Retreat detection ──────────────────────────────────────
function checkRetreat(pos, team, group) {
  var mine = units.filter(u => u.team === team && u.alive && u.group === group);
  if (!mine.length) return false;
  var cx = mine.reduce((s, u) => s + u.x, 0) / mine.length;
  var cy = mine.reduce((s, u) => s + u.y, 0) / mine.length;
  var enemies = units.filter(u => u.team !== team && u.team !== 2 && u.alive);
  if (!enemies.length) return false;
  var closest = enemies[0];
  enemies.forEach(e => {
    if (Math.hypot(e.x - cx, e.y - cy) < Math.hypot(closest.x - cx, closest.y - cy))
      closest = e;
  });
  var toEnemy  = { x: closest.x - cx, y: closest.y - cy };
  var toTarget = { x: pos.x - cx,     y: pos.y - cy     };
  var dot = toEnemy.x * toTarget.x + toEnemy.y * toTarget.y;
  var lenE = Math.hypot(toEnemy.x, toEnemy.y);
  var lenT = Math.hypot(toTarget.x, toTarget.y);
  if (lenE < 60 || lenT < 20) return false;
  return dot / (lenE * lenT) < -0.5;
}

function setTarget(team, group, pos) {
  targets[team][group] = pos;
  groupRetreating[team][group] = checkRetreat(pos, team, group);
  units.forEach(u => {
    if (u.team === team && u.group === group)
      u.retreating = groupRetreating[team][group];
  });
}

// ── Input ──────────────────────────────────────────────────
// playerSprint[group]: true = юниты группы бегут (спринт-режим)
var playerSprint = [false, false];

// Определяем какая группа ближе к точке касания (мировые координаты)
function closestGroup(wx, wy) {
  if (!isSplit) return 0;
  var g0x=0,g0y=0,g0n=0, g1x=0,g1y=0,g1n=0;
  for (var _gi=0; _gi<units.length; _gi++) {
    var _gu = units[_gi];
    if (!_gu.alive || _gu.team !== 0) continue;
    if (_gu.group === 0) { g0x+=_gu.x; g0y+=_gu.y; g0n++; }
    else                 { g1x+=_gu.x; g1y+=_gu.y; g1n++; }
  }
  if (!g0n) return 1;
  if (!g1n) return 0;
  var d0 = Math.hypot(wx - g0x/g0n, wy - g0y/g0n);
  var d1 = Math.hypot(wx - g1x/g1n, wy - g1y/g1n);
  return d0 <= d1 ? 0 : 1;
}

// Двойной тап
var _lastTapMs = 0, _lastTapCX = 0, _lastTapCY = 0;
var DOUBLE_TAP_MS  = 350;
var DOUBLE_TAP_PX  = 50;

function handleTap(clientX, clientY) {
  var pos = getPos(clientX, clientY);
  var grp = closestGroup(pos.x, pos.y);
  var now = performance.now();
  var dt2 = now - _lastTapMs;
  var dist2 = Math.hypot(clientX - _lastTapCX, clientY - _lastTapCY);
  if (dt2 < DOUBLE_TAP_MS && dist2 < DOUBLE_TAP_PX) {
    // Двойной тап — переключить спринт для ближайшей группы
    if (isSplit) {
      playerSprint[grp] = !playerSprint[grp];
    } else {
      playerSprint[0] = !playerSprint[0];
      playerSprint[1] = playerSprint[0];
    }
    _lastTapMs = 0; // сброс чтобы тройной не триггерил снова
  } else {
    // Одиночный тап — мерж (если были сплит) + двигать к точке
    if (isSplit) {
      isSplit = false;
      playerSprint[0] = playerSprint[0] || playerSprint[1];
      playerSprint[1] = playerSprint[0];
      units.forEach(function(u) { if (u.team === 0) u.group = 0; });
    }
    setTarget(0, 0, pos);
    setTarget(0, 1, pos);
    _lastTapMs = now; _lastTapCX = clientX; _lastTapCY = clientY;
  }
}

// Мышь (десктоп): ЛКМ = двигать/тап, ПКМ/средняя = скролл
var mouseScrolling = false, mouseScrollX = 0, mouseScrollY = 0;
var mouseDragging = false, mouseDragStartX = 0, mouseDragStartY = 0;
canvas.addEventListener('mousedown', function(e) {
  if (gameOver) { resetGame(); return; }
  if (e.button === 0) {
    mouseDragging = false;
    mouseDragStartX = e.clientX; mouseDragStartY = e.clientY;
  }
  if (e.button === 1 || e.button === 2) {
    mouseScrolling = true; mouseScrollX = e.clientX; mouseScrollY = e.clientY;
  }
});
canvas.addEventListener('mousemove', function(e) {
  if (gameOver) return;
  if (mouseScrolling) {
    camX = Math.max(0, Math.min(MAP_W - W/ZOOM, camX - (e.clientX - mouseScrollX)/ZOOM));
    camY = Math.max(0, Math.min(MAP_H - H/ZOOM, camY - (e.clientY - mouseScrollY)/ZOOM));
    camTargetX = camX; camTargetY = camY;
    mouseScrollX = e.clientX; mouseScrollY = e.clientY;
    return;
  }
  if (e.buttons === 1) {
    var d = Math.hypot(e.clientX - mouseDragStartX, e.clientY - mouseDragStartY);
    if (d > 8) {
      mouseDragging = true;
      var pos = getPos(e.clientX, e.clientY);
      var grp = closestGroup(pos.x, pos.y);
      if (isSplit) { setTarget(0, grp, pos); }
      else         { setTarget(0, 0, pos); setTarget(0, 1, pos); }
    }
  }
});
canvas.addEventListener('mouseup', function(e) {
  mouseScrolling = false;
  if (e.button === 0 && !mouseDragging) {
    handleTap(e.clientX, e.clientY);
  }
  mouseDragging = false;
});
canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

// Блокируем системный скролл iOS
document.body.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

// Тач: 1 палец = тап/тянуть, 2 пальца = сплит/мерж
var touchStartX = 0, touchStartY = 0, touchMoved = false;
var lastTouchX = 0, lastTouchY = 0;
var touchActiveGroup = 0; // группа выбранная в начале касания

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (gameOver) { resetGame(); return; }
  if (e.touches.length === 1) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    lastTouchX = touchStartX; lastTouchY = touchStartY;
    touchMoved = false;
    var pos = getPos(touchStartX, touchStartY);
    touchActiveGroup = closestGroup(pos.x, pos.y);
  } else if (e.touches.length === 2) {
    // 2 пальца = переключить сплит
    if (isSplit) {
      // мерж
      isSplit = false;
      playerSprint[0] = playerSprint[0] || playerSprint[1];
      playerSprint[1] = playerSprint[0];
      units.forEach(function(u) { if (u.team === 0) u.group = 0; });
    } else {
      splitArmy();
      // направляем каждую группу к своему пальцу
      var pos0 = getPos(e.touches[0].clientX, e.touches[0].clientY);
      var pos1 = getPos(e.touches[1].clientX, e.touches[1].clientY);
      setTarget(0, 0, pos0); setTarget(0, 1, pos1);
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (gameOver) return;
  if (e.touches.length === 1) {
    var d = Math.hypot(e.touches[0].clientX - touchStartX, e.touches[0].clientY - touchStartY);
    if (d > 8) {
      touchMoved = true;
      var pos = getPos(e.touches[0].clientX, e.touches[0].clientY);
      if (isSplit) { setTarget(0, touchActiveGroup, pos); }
      else         { setTarget(0, 0, pos); setTarget(0, 1, pos); }
    }
    lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY;
  } else if (e.touches.length === 2 && isSplit) {
    // Пока 2 пальца на экране после сплита — двигаем группы к пальцам
    setTarget(0, 0, getPos(e.touches[0].clientX, e.touches[0].clientY));
    setTarget(0, 1, getPos(e.touches[1].clientX, e.touches[1].clientY));
  }
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
  // Когда поднимаем палец — сбрасываем touchMoved чтобы переход
  // 2→1 палец не помечался как "drag"
  if (e.touches.length === 1) {
    touchMoved = false;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    lastTouchX = touchStartX; lastTouchY = touchStartY;
    var pos = getPos(touchStartX, touchStartY);
    touchActiveGroup = closestGroup(pos.x, pos.y);
  }
  if (e.touches.length === 0) {
    if (!touchMoved) handleTap(lastTouchX, lastTouchY);
    touchMoved = false;
  }
});

function getPos(clientX, clientY) {
  var r = canvas.getBoundingClientRect();
  // Смещаем цель на 50px вверх чтобы юнит был виден за пальцем
  return { x: (clientX - r.left) / ZOOM + camX,
           y: (clientY - r.top - 50) / ZOOM + camY };
}

function splitArmy() {
  isSplit = true;
  var alive = units.filter(u => u.team === 0 && u.alive);
  alive.forEach((u, i) => { u.group = i < Math.ceil(alive.length / 2) ? 0 : 1; });
}

// ── Combat helpers ─────────────────────────────────────────
function isFighting(u) {
  return u.attacking !== null || u.fighters.length > 0;
}

function isEnemy(a, b) {
  // Нейтрал (2) — враг обоих; 0 и 1 — враги друг друга
  if (a.team === b.team) return false;
  if (a.team === 2 || b.team === 2) return true; // нейтрал дерётся со всеми
  return true; // разные команды
}

function disengageUnit(u) {
  if (u.attacking) {
    var t = u.attacking;
    t.fighters = t.fighters.filter(f => f !== u);
    u.attacking = null;
  }
  u.fighters.forEach(f => { f.attacking = null; });
  u.fighters = [];
  u.retreating = false;
}

// ── Combat round ───────────────────────────────────────────
function fightRound(attacker, target) {
  if (!attacker.alive || !target.alive) return;

  if (attacker.stunTimer > 0) {
    attacker.stunTimer--;
    return;
  }

  var atkDmg = attacker.atk;

  // ── Бонус заряда (chargeDist накоплен во время разгона) ───
  var cd = attacker.chargeDist || 0;
  var chargeTier = cd >= CHARGE_DIST_T3 ? 3 : cd >= CHARGE_DIST_T2 ? 2 : cd >= CHARGE_DIST_T1 ? 1 : 0;
  if (chargeTier > 0) {
    var dmgMult = chargeTier === 1 ? 1.25 : chargeTier === 2 ? 1.55 : 1.9;
    atkDmg *= dmgMult;
    // Тир 3: стан вместо обычного удара
    if (chargeTier === 3 && target.stunTimer === 0) {
      applyDamage(target, atkDmg);
      target.stunTimer = 1;
      target.retreatBlocked = true;
      attacker.chargeDist = 0;
      return;
    }
    attacker.chargeDist = 0; // разгон потрачен
  }

  var missChance = attacker.retreating ? 0.65 : (chargeTier >= 2 ? 0.25 : 0.5); // разгон снижает промах
  var canRetreat = false;

  if (Math.random() < missChance) {
    canRetreat = true;
  } else {
    var canBlock = target.stunTimer === 0 && chargeTier < 3;
    if (canBlock && Math.random() < (chargeTier >= 1 ? 0.25 : 0.5)) { // блок труднее против разгона
      target.blockTimer = 0.35;
      canRetreat = true;
    } else {
      canRetreat = false;
      if (Math.random() < 0.5) {
        applyDamage(target, atkDmg * STUN_RATIO);
        target.stunTimer = 1;
        target.retreatBlocked = true;
      } else {
        applyDamage(target, atkDmg);
        target.retreatBlocked = true;
      }
    }
  }

  // Отступление с рывком: 100% если не получил удар, 30% через удар (риск удара в спину)
  if (attacker.retreating && !attacker.isNeutral) {
    if (attacker.stunTimer === 0) {
      var dashChance = canRetreat ? 1.0 : 0.3;
      if (Math.random() < dashChance) {
        if (!canRetreat && target.alive && Math.random() < 0.5) {
          applyDamage(attacker, target.atk * 0.5);
        }
        retreatUnit(attacker);
      } else {
        attacker.retreatBlocked = true;
      }
    } else {
      attacker.retreatBlocked = true;
    }
  }

  if (target.retreating && target.stunTimer > 0 && !target.isNeutral) {
    target.retreatBlocked = true;
  }

  panicCheck(attacker);
  panicCheck(target);

  // Нейтральный маленький: оглушён и остался один → сдаётся
  if (target.alive && target.isNeutral && target.isSmall && target.stunTimer > 0) {
    var neutralAllies = units.filter(function(u) {
      return u !== target && u.alive && u.isNeutral && Math.hypot(u.x - target.x, u.y - target.y) < 120;
    });
    if (neutralAllies.length === 0) {
      retreatUnit(target); // уйдёт в startWavering
    }
  }
}

function applyDamage(unit, dmg) {
  if (!unit.alive) return;
  unit.hp = Math.max(0, unit.hp - dmg);
  unit.flashTimer = 0.2;
  unit.shakeX = (Math.random() - 0.5) * 6;
  unit.shakeY = (Math.random() - 0.5) * 6;
  if (unit.wavering) unit.waveringHit = true; // удар во время колебания → мгновенная сдача
  if (unit.hp <= 0) killUnit(unit);
}

function panicCheck(unit) {
  if (!unit.alive || !isFighting(unit) || unit.isNeutral) return;

  // Перевес 4:1 → паника после 3 раундов под таким давлением
  if (unit.fighters.length >= 3) {
    unit.outnumberedRounds = (unit.outnumberedRounds || 0) + 1;
    if (unit.outnumberedRounds >= 3) {
      unit.outnumberedRounds = 0;
      retreatUnit(unit);
      return;
    }
  } else {
    unit.outnumberedRounds = 0; // давление спало — сброс
  }

  // Паника при низком HP: шанс снижается от числа союзников рядом
  if (unit.hp / unit.maxHp < 0.3) {
    var nearAllies = 0;
    forNearby(unit.x, unit.y, 150, function(u) {
      if (u !== unit && u.alive && u.team === unit.team && !u.isNeutral &&
          Math.hypot(u.x - unit.x, u.y - unit.y) < 150) nearAllies++;
    });
    // Базовый шанс выше: 0 союзников=35%, 1=20%, 2=13%, 4=8%
    var chance = 0.35 / (1 + nearAllies * 0.6);
    if (Math.random() < chance) retreatUnit(unit);
  }
}

function startWavering(unit, captor) {
  // Вместо мгновенной сдачи — период колебания
  if (unit.wavering) return; // уже колеблется
  unit.wavering = true;
  unit.waveringTimer = 2.0;    // 2 секунды на раздумье
  unit.waveringCourage = 0;    // накапливается от событий рядом
  unit._waveringCaptor = captor;
  unit.waveringHit = false;
}

function surrenderSmall(unit, captor) {
  // Нейтральный маленький охранник сдаётся победителю
  disengageUnit(unit);
  unit.campGuard = null;
  unit.isNeutral = false;
  unit.colorFrom = 2;
  teamAlive[unit.team]--; unit.team = captor.team; teamAlive[unit.team]++;
  unit.group = 0;
  unit.hp = 1.5; unit.maxHp = 3;
  // Вырастает и меняет цвет
  unit.growFrom = unit.radius; // = 9
  unit.growTimer = 1.5;
  unit.growDuration = 1.5;
  unit.colorTimer = 1.5;
  unit.colorDuration = 1.5;
  unit.isSmall = false;
  unit.atk = ATK_DMG;
  unit.flashTimer = 0.4; // белая вспышка в момент сдачи
  unit.hp = unit.maxHp * 0.5; // восстанавливаем до 50% hp
}

function killUnit(unit) {
  disengageUnit(unit);
  unit.alive = false;
  unit.hp = 0;
  aliveCount--;
  teamAlive[unit.team] = Math.max(0, teamAlive[unit.team] - 1);
  // Уведомляем homecamp — нужен новый боец (если лагерь ещё наш)
  if (unit.homecamp && unit.homecamp.team === unit.team && !unit.isNeutral) {
    unit.homecamp.pending++;
    if (unit.homecamp.spawnTimer <= 0) unit.homecamp.spawnTimer = SPAWN_TIME;
  }
  // Уведомляем ближних через пространственную сетку
  forNearby(unit.x, unit.y, 150, function(w) {
    if (!w.alive || w === unit) return;
    var d = Math.hypot(w.x - unit.x, w.y - unit.y);
    // Courage колеблющимся нейтралам
    if (w.wavering && w.isNeutral && d <= 120) {
      if (!w._waveringCaptor || unit.team === w._waveringCaptor.team) {
        w.waveringCourage = Math.min(1, (w.waveringCourage || 0) + 0.35);
      }
    }
    // Страх союзникам
    if (w.team === unit.team && !w.isNeutral && d <= 150) {
      w.fearStack = Math.min((w.fearStack || 0) + 1, 6);
      w.fearStackTimer = 3;
      if (!w.recentDeathTimes) w.recentDeathTimes = [];
      w.recentDeathTimes.push(gameTime);
      w.recentDeathTimes = w.recentDeathTimes.filter(function(t) { return gameTime - t < 2; });
      if (w.recentDeathTimes.length >= 3) { w.fearBurst = true; w.fearBurstTimer = 4; }
    }
  });
}

function retreatUnit(unit) {
  if (!unit.alive) return;
  // Нейтральный маленький — паника = колебание, потом сдача
  if (unit.isNeutral && unit.isSmall) {
    if (unit.wavering) return; // уже колеблется, не дублируем
    var captor = unit.fighters.length > 0 ? unit.fighters[0] : null;
    if (!captor) captor = units.find(function(u) {
      return u.alive && !u.isNeutral && Math.hypot(u.x - unit.x, u.y - unit.y) < 80;
    });
    if (captor) { startWavering(unit, captor); return; }
  }
  if (unit.isNeutral) return;
  // Не-нейтрал убегает → добавляем courage нейтралам, которые колеблются рядом
  forNearby(unit.x, unit.y, 120, function(w) {
    if (!w.alive || !w.wavering || !w.isNeutral) return;
    if (Math.hypot(w.x - unit.x, w.y - unit.y) > 120) return;
    if (w._waveringCaptor && unit.team === w._waveringCaptor.team) return;
    w.waveringCourage = Math.min(1, (w.waveringCourage || 0) + 0.25);
  });
  var allies = [];
  forNearby(unit.x, unit.y, 200, function(u) {
    if (u !== unit && u.alive && u.team === unit.team && !u.isNeutral &&
        Math.hypot(u.x - unit.x, u.y - unit.y) < 200) allies.push(u);
  });
  if (allies.length === 0) {
    captureUnit(unit);
  } else {
    disengageUnit(unit);
    // Юнит лично бежит к базе — не двигаем цель всей группы
    unit.retreating = true;
    unit._retreatX = unit.team === 0 ? 60 : MAP_W - 60;
    unit._retreatY = MAP_H / 2;
  }
}

function captureUnit(unit) {
  if (unit.isNeutral) return;
  disengageUnit(unit);
  unit.colorFrom = unit.team;
  teamAlive[unit.team]--;
  unit.team = 1 - unit.team;
  teamAlive[unit.team]++;
  unit.group = 0;
  unit.hp = Math.ceil(unit.maxHp * 0.5);
  unit.retreating = false;
  unit.waiting = false;
  unit.stunTimer = 0;
  unit.colorTimer = 5;
  unit.colorDuration = 5;
}

// ── Movement ───────────────────────────────────────────────
function updateMovement(dt) {

  units.forEach(u => {
    if (!u.alive || isFighting(u) || (u.campGuard && u.isNeutral)) return;

    // Ожидает у лагеря: стоит пока не подойдёт союзник из армии
    if (u.waiting) {
      var joined = false;
      forNearby(u.x, u.y, 80, function(other) {
        if (!joined && other !== u && other.alive && other.team === u.team && !other.waiting && !other.isNeutral)
          joined = true;
      });
      if (joined) u.waiting = false;
      else return; // стоим на месте, combat всё равно сработает если враг подойдёт
    }

    // Личное отступление: юнит бежит к своей базе, не тянет всю группу
    var tx, ty;
    if (u.retreating && u._retreatX !== undefined) {
      tx = u._retreatX; ty = u._retreatY;
    } else {
      tx = targets[u.team][u.group] ? targets[u.team][u.group].x : u.x;
      ty = targets[u.team][u.group] ? targets[u.team][u.group].y : u.y;
    }
    var dx = tx - u.x, dy = ty - u.y;
    var dist = Math.hypot(dx, dy);

    // ── Стамина и спринт ──────────────────────────────────────
    // playerSprint[group] — переключатель (двойной тап), AI не спринтует
    var isSprinting = (u.team === 0) ? playerSprint[u.group] : false;
    if (isSprinting && u.stamina > 0 && !u.attacking) {
      // Спринт: holdTime нарастает пока активен режим
      u.holdTime = Math.min((u.holdTime || 0) + dt, 1.5);
      u.stamina = Math.max(0, u.stamina - STAMINA_DRAIN * dt);
      // Автоматически снять спринт при истощении стамины
      if (u.stamina <= 0) playerSprint[u.group] = false;
    } else {
      u.holdTime = Math.max((u.holdTime || 0) - dt * 2, 0); // торможение вдвое быстрее
      if (!isSprinting || u.stamina <= 0) {
        u.stamina = Math.min(STAMINA_MAX, u.stamina + STAMINA_REGEN * dt);
      }
    }
    // chargeRatio: 0=марш, 1=полный разгон
    var chargeRatio = (u.holdTime || 0) / 1.5;
    var maxSpd = SPEED + (CHARGE_SPEED - SPEED) * chargeRatio;
    // Накапливаем дистанцию разгона
    if (chargeRatio > 0.1 && dist > 10 && !u.attacking) {
      u.chargeDist = (u.chargeDist || 0) + maxSpd;
    } else if (!isSprinting || u.attacking) {
      u.chargeDist = 0;
    }

    if (dist > 4) {
      u.vx += (dx / dist) * maxSpd * 0.15;
      u.vy += (dy / dist) * maxSpd * 0.15;
    }
    forNearby(u.x, u.y, SEP, function(other) {
      if (other === u || !other.alive) return;
      // Союзники — всегда разделяем; врагов разделяем только если не атакуем их
      if (other.team !== u.team && (u.attacking === other || other.attacking === u)) return;
      var ox = u.x - other.x, oy = u.y - other.y;
      var d = Math.hypot(ox, oy);
      if (d < SEP && d > 0) {
        var factor = other.team === u.team ? 0.12 : 0.04;
        u.vx += (ox / d) * (SEP - d) * factor;
        u.vy += (oy / d) * (SEP - d) * factor;
      }
    });
    u.vx *= 0.85; u.vy *= 0.85;
    var spd = Math.hypot(u.vx, u.vy);
    if (spd > maxSpd) { u.vx = u.vx / spd * maxSpd; u.vy = u.vy / spd * maxSpd; }
    u.x += u.vx; u.y += u.vy;
    u.x = Math.max(u.radius, Math.min(MAP_W - u.radius, u.x));
    u.y = Math.max(u.radius, Math.min(MAP_H - u.radius, u.y));
    // Дошёл до базы — снимаем личное отступление
    if (u.retreating && u._retreatX !== undefined) {
      if (Math.hypot(u.x - u._retreatX, u.y - u._retreatY) < 30) {
        u.retreating = false;
        u._retreatX = undefined;
      }
    }
  });
}

// ── Combat update ──────────────────────────────────────────
function updateCombat(dt) {
  units.forEach(a => {
    if (!a.alive || a.attacking !== null) return;
    var best = null, bestDist = Infinity;
    forNearby(a.x, a.y, FIGHT_RANGE + a.radius + 20, function(b) {
      if (!b.alive || !isEnemy(a, b)) return;
      var d = Math.hypot(a.x - b.x, a.y - b.y) - a.radius - b.radius;
      if (d < FIGHT_RANGE && d < bestDist) { best = b; bestDist = d; }
    });
    if (best) {
      a.attacking = best;
      best.fighters.push(a);
      a.fightTimer = 0;
    }
  });

  units.forEach(u => {
    if (!u.alive || u.attacking === null) return;
    var target = u.attacking;
    if (!target.alive) { disengageUnit(u); return; }
    u.fightTimer += dt;
    if (u.fightTimer >= ROUND_TIME) {
      u.fightTimer = 0;
      u.retreatBlocked = false;
      target.retreatBlocked = false;
      fightRound(u, target);
    }
    var d = Math.hypot(u.x - target.x, u.y - target.y) - u.radius - target.radius;
    if (d > FIGHT_RANGE * 3) disengageUnit(u);
  });

  units.forEach(u => {
    if (!u.alive) return;
    u.shakeX *= 0.7; u.shakeY *= 0.7;
    if (u.flashTimer > 0) u.flashTimer -= dt;
    if (u.blockTimer > 0) u.blockTimer = Math.max(0, u.blockTimer - dt);
    if (u.colorTimer > 0) u.colorTimer = Math.max(0, u.colorTimer - dt);
    // stunTimer: если юнит вне боя — сбрасываем по времени (0.4с/тик)
    if (u.stunTimer > 0 && !isFighting(u)) {
      u.stunTimer = Math.max(0, u.stunTimer - dt / 0.4);
    }
    // Анимация роста резервиста: плавный pop 9→20→14
    if (u.growTimer > 0) {
      u.growTimer = Math.max(0, u.growTimer - dt);
      var dur = u.growDuration || 3;
      var t = 1 - u.growTimer / dur; // 0→1
      var PEAK = 20, TARGET = 14;
      var BURST = 0.55; // первые 55% — нарастание до пика, остальные — оседание
      var r;
      if (t < BURST) {
        // ease-out нарастание: быстро в начале, замедляется у пика
        var e = 1 - Math.pow(1 - t / BURST, 2);
        r = u.growFrom + (PEAK - u.growFrom) * e;
      } else {
        // пружинное оседание к целевому
        var s = (t - BURST) / (1 - BURST); // 0→1
        var spring = 1 - (1 - s) * Math.cos(s * Math.PI * 1.5) * (1 - s);
        r = PEAK - (PEAK - TARGET) * Math.min(1, spring);
      }
      u.radius = r;
      if (u.growTimer === 0) u.radius = TARGET;
    }
  });

  // ── Wavering: колеблющиеся нейтральные юниты ────────────────
  units.forEach(function(u) {
    if (!u.alive || !u.wavering) return;
    u.waveringTimer -= dt;

    // Получил удар во время колебания → мгновенная сдача
    if (u.waveringHit) {
      u.wavering = false; u.waveringHit = false;
      var cap = u._waveringCaptor;
      if (!cap || !cap.alive) cap = units.find(function(v) {
        return v.alive && !v.isNeutral && Math.hypot(v.x - u.x, v.y - u.y) < 80;
      });
      if (cap) surrenderSmall(u, cap);
      return;
    }

    // Courage: союзник убил врага рядом или враг отступил рядом — добавляется извне (см. killUnit / retreatUnit)
    // Если накопил courage → оправился
    if (u.waveringCourage >= 1.0) {
      u.wavering = false;
      u.waveringCourage = 0;
      u.flashTimer = 0.3; // белая вспышка — устоял
      return;
    }

    // Таймер истёк → сдаётся
    if (u.waveringTimer <= 0) {
      u.wavering = false;
      var cap2 = u._waveringCaptor;
      if (!cap2 || !cap2.alive) cap2 = units.find(function(v) {
        return v.alive && !v.isNeutral && Math.hypot(v.x - u.x, v.y - u.y) < 80;
      });
      if (cap2) surrenderSmall(u, cap2);
    }
  });

  // Страх и ужас — тикаем для всех живых юнитов
  units.forEach(u => {
    if (!u.alive || u.isNeutral) return;
    // Спад fearStack: -1 каждые 3с
    if (u.fearStack > 0) {
      u.fearStackTimer -= dt;
      if (u.fearStackTimer <= 0) { u.fearStack--; u.fearStackTimer = 3; }
    }
    // Спад fearBurst
    if (u.fearBurst) {
      u.fearBurstTimer -= dt;
      if (u.fearBurstTimer <= 0) u.fearBurst = false;
    }
    // Проверка паники от страха (раз в секунду)
    if (u.fearStack >= 2 || u.fearBurst) {
      u.fearPanicTimer += dt;
      if (u.fearPanicTimer >= 1) {
        u.fearPanicTimer = 0;
        var chance = 0;
        if (u.fearBurst && u.fearStack >= 3) chance = 0.85;
        else if (u.fearBurst)               chance = 0.60;
        else if (u.fearStack >= 4)          chance = 0.35;
        else if (u.fearStack >= 3)          chance = 0.20;
        else                                chance = 0.10;
        if (Math.random() < chance) retreatUnit(u);
      }
    } else {
      u.fearPanicTimer = 0;
    }
  });

  units.forEach(u => {
    if (!u.alive || isFighting(u)) return;
    if (u.hp < u.maxHp) {
      u.regenTimer += dt;
      if (u.regenTimer >= 1) { u.hp = Math.min(u.maxHp, u.hp + REGEN_RATE); u.regenTimer = 0; }
    }
  });
}

// ── Victory / смена командования ───────────────────────────
function checkVictory() {
  if (gameOver) return;
  var total = camps.length;

  // Смерть всех активных (не-waiting) юнитов синих — ищем лагерь с резервистами
  var activeBlue = 0;
  for (var _ab = 0; _ab < units.length; _ab++) {
    var _abu = units[_ab];
    if (_abu.alive && _abu.team === 0 && !_abu.waiting && !_abu.isNeutral) activeBlue++;
  }
  if (activeBlue === 0) {
    // Есть ли синие лагеря с ждущими резервистами?
    var reserveCamps = [];
    for (var _vc = 0; _vc < camps.length; _vc++) {
      var _camp = camps[_vc];
      if (_camp.team !== 0) continue;
      var hasWaiting = false;
      for (var _vu = 0; _vu < units.length; _vu++) {
        var _u2 = units[_vu];
        if (_u2.alive && _u2.team === 0 && _u2.waiting && _u2.homecamp === _camp) { hasWaiting = true; break; }
      }
      if (hasWaiting) reserveCamps.push(_camp);
    }
    if (reserveCamps.length > 0) {
      // Выбираем случайный лагерь с резервом — игрок теперь командует ими
      var newCamp = reserveCamps[Math.floor(Math.random() * reserveCamps.length)];
      playerRespawnCamp = newCamp;
      // Сбрасываем сплит — один отряд под одним пальцем
      isSplit = false;
      playerSprint[0] = false; playerSprint[1] = false;
      // Активируем резервистов: снимаем waiting, переводим в группу 0
      for (var _wu = 0; _wu < units.length; _wu++) {
        var _w = units[_wu];
        if (_w.alive && _w.team === 0 && _w.waiting && _w.homecamp === newCamp) {
          _w.waiting = false;
          _w.group = 0;
        }
      }
      // Переносим цель к лагерю
      targets[0][0] = { x: newCamp.x, y: newCamp.y };
      targets[0][1] = { x: newCamp.x, y: newCamp.y };
      // Двигаем камеру к лагерю
      camTargetX = Math.max(0, Math.min(MAP_W - W / ZOOM, newCamp.x - W / ZOOM / 2));
      camTargetY = Math.max(0, Math.min(MAP_H - H / ZOOM, newCamp.y - H / ZOOM / 2));
      return; // не конец игры — продолжаем
    }
    // Нет резерва — конец
    gameOver = 'red';
  }

  // Смерть всех активных (не-waiting) юнитов красных — активируем их резервистов
  var activeRed = 0;
  for (var _ar = 0; _ar < units.length; _ar++) {
    var _aru = units[_ar];
    if (_aru.alive && _aru.team === 1 && !_aru.waiting && !_aru.isNeutral) activeRed++;
  }
  if (activeRed === 0) {
    var redReserveCamps = [];
    for (var _rc = 0; _rc < camps.length; _rc++) {
      var _rcamp = camps[_rc];
      if (_rcamp.team !== 1) continue;
      for (var _ru = 0; _ru < units.length; _ru++) {
        var _ru2 = units[_ru];
        if (_ru2.alive && _ru2.team === 1 && _ru2.waiting && _ru2.homecamp === _rcamp) {
          redReserveCamps.push(_rcamp); break;
        }
      }
    }
    if (redReserveCamps.length > 0) {
      // Выбираем ближайший к центру карты лагерь с резервом
      var bestRC = redReserveCamps[0];
      var bestRDist = Math.hypot(bestRC.x - MAP_W/2, bestRC.y - MAP_H/2);
      for (var _brc = 1; _brc < redReserveCamps.length; _brc++) {
        var _bd = Math.hypot(redReserveCamps[_brc].x - MAP_W/2, redReserveCamps[_brc].y - MAP_H/2);
        if (_bd < bestRDist) { bestRDist = _bd; bestRC = redReserveCamps[_brc]; }
      }
      // Активируем резервистов этого лагеря
      for (var _aw = 0; _aw < units.length; _aw++) {
        var _awu = units[_aw];
        if (_awu.alive && _awu.team === 1 && _awu.waiting && _awu.homecamp === bestRC) {
          _awu.waiting = false;
          _awu.group = 0;
        }
      }
      // ИИ получает новую точку сбора
      targets[1][0] = { x: bestRC.x, y: bestRC.y };
      targets[1][1] = { x: bestRC.x, y: bestRC.y };
      aiMode = 'rally'; aiModeTimer = 0;
      return;
    }
    // Нет резерва — победа синих
    gameOver = 'blue';
    return;
  }

  if (teamCamps[0] === total) gameOver = 'blue';
  if (teamCamps[1] === total) gameOver = 'red';
}

function resetGame() {
  gameOver = null; isSplit = false;
  playerSprint[0] = false; playerSprint[1] = false;
  targets[0][0] = targets[0][1] = { x: 80,        y: MAP_H/2 };
  targets[1][0] = targets[1][1] = { x: MAP_W-80,  y: MAP_H/2 };
  groupRetreating[0][0] = groupRetreating[0][1] = false;
  groupRetreating[1][0] = groupRetreating[1][1] = false;
  playerRespawnCamp = null; playerRespawnMsg = ''; playerRespawnMsgTimer = 0;
  aiMode = 'camp'; aiModeTimer = 0; aiTimer = 0;
  makeCamps();
  initUnits();
}

// ── Draw (Pixi) ────────────────────────────────────────────
function draw() {
  var g = worldGfx;
  g.clear();
  _resetWorldText();

  // Камера → worldContainer transform
  worldContainer.x = -camX * ZOOM;
  worldContainer.y = -camY * ZOOM;
  worldContainer.scale.set(ZOOM);

  // Центральная линия мира
  g.lineStyle(1, 0xffffff, 0.06);
  g.moveTo(MAP_W/2, 0); g.lineTo(MAP_W/2, MAP_H);

  // Лагеря
  camps.forEach(function(camp) {
    var cn = camp.team === -1 ? 0x888866 :
             camp.team === 0  ? c2n(TEAM_COLOR[0]) : c2n(TEAM_COLOR[1]);
    var cns = camp.team === -1 ? '#888866' :
              camp.team === 0  ? TEAM_COLOR[0] : TEAM_COLOR[1];

    g.lineStyle(2, cn, 1);
    g.beginFill(cn, 0.2);
    g.drawCircle(camp.x, camp.y, camp.radius);
    g.endFill();

    // Иконка ⛺ через текстовый пул
    var t = _getWorldText();
    t.text = '⛺'; t.style.fontSize = 14;
    t.position.set(camp.x, camp.y);

    // Кольцо прогресса спавна
    if (camp.team !== -1) {
      var frac = 1 - camp.spawnTimer / SPAWN_TIME;
      if (frac > 0) {
        // Pixi v7: рисуем дугу через arc
        g.lineStyle(3, cn, 1);
        g.arc(camp.x, camp.y, camp.radius + 5, -Math.PI/2, -Math.PI/2 + frac * Math.PI * 2);
      }
    }
  });

  // Линии боя
  units.forEach(function(u) {
    if (!u.alive || !u.attacking || !u.attacking.alive) return;
    g.lineStyle(1, 0xffc800, 0.18);
    g.moveTo(u.x, u.y); g.lineTo(u.attacking.x, u.attacking.y);
  });

  // Юниты
  units.forEach(function(u) {
    if (!u.alive) return;
    var _pad = 30;
    if (u.x < camX - _pad || u.x > camX + W/ZOOM + _pad ||
        u.y < camY - _pad || u.y > camY + H/ZOOM + _pad) return;

    var sx = Math.abs(u.shakeX) > 0.3 ? u.shakeX : 0;
    var sy = Math.abs(u.shakeY) > 0.3 ? u.shakeY : 0;
    var rx = u.x + sx, ry = u.y + sy;

    var col  = TEAM_COLOR[u.team] || '#aaaaaa';
    var dark = TEAM_DARK[u.team]  || '#555555';

    // Анимация смены цвета через белый (перерождение)
    if (u.colorTimer > 0 && u.colorFrom >= 0 && u.colorDuration > 0) {
      var ct = 1 - u.colorTimer / u.colorDuration;
      var fromCol  = TEAM_COLOR[u.colorFrom] || '#aaa';
      var fromDark = TEAM_DARK[u.colorFrom]  || '#555';
      var toCol  = TEAM_COLOR[u.team] || '#aaa';
      var toDark = TEAM_DARK[u.team]  || '#555';
      if (ct < 0.5) {
        col  = lerpColor(fromCol,  '#ffffff', ct * 2);
        dark = lerpColor(fromDark, '#cccccc', ct * 2);
      } else {
        col  = lerpColor('#ffffff', toCol,  (ct - 0.5) * 2);
        dark = lerpColor('#cccccc', toDark, (ct - 0.5) * 2);
      }
    }

    var drawCol = col;
    if (u.wavering) {
      var wPulse = 0.45 + 0.45 * Math.sin(gameTime * 8);
      drawCol = lerpColor('#aaaaaa', col, wPulse);
    }
    var fc = u.flashTimer > 0 ? '#ffffff' : drawCol;

    // Кольцо-вспышка (grow)
    if (u.growTimer > 0 && u.growDuration > 0) {
      var gp = 1 - u.growTimer / u.growDuration;
      if (gp < 0.40) {
        var burst = gp / 0.40;
        var ringR = u.radius + 3 + burst * 10;
        var ringA = (1 - burst) * 0.7;
        g.lineStyle(2 * (1 - burst) + 0.5, 0xffffc8, ringA);
        g.drawCircle(rx, ry, ringR);
      }
      var glowA = Math.max(0, 0.35 * (u.growTimer / u.growDuration));
      if (glowA > 0.02) {
        g.lineStyle(2, 0xffffb4, glowA);
        g.drawCircle(rx, ry, u.radius + 3);
      }
    }

    // Тело юнита
    g.lineStyle(2, c2n(dark), 1);
    g.beginFill(c2n(fc), 1);
    g.drawCircle(rx, ry, u.radius);
    g.endFill();

    // HP bar
    var bw = u.radius * 2, bh = 3;
    var bx = rx - u.radius, by = ry - u.radius - 7;
    g.lineStyle(0);
    g.beginFill(0x000000, 0.5);
    g.drawRect(bx, by, bw, bh);
    g.endFill();
    var hpR = u.hp / u.maxHp;
    var hpC = hpR > 0.5 ? 0x44ff88 : hpR > 0.25 ? 0xffcc00 : 0xff4444;
    g.beginFill(hpC, 1);
    g.drawRect(bx, by, bw * hpR, bh);
    g.endFill();

    // Wavering дуга
    if (u.wavering) {
      var wFrac = Math.max(0, u.waveringTimer / 2.0);
      var wAng = -Math.PI / 2;
      g.lineStyle(2, 0xb4b4dc, 0.85);
      g.arc(rx, ry, u.radius + 6, wAng, wAng + Math.PI * 2 * wFrac);
      if (u.waveringCourage > 0) {
        g.lineStyle(1.5, 0x50dc78, 0.85);
        g.arc(rx, ry, u.radius + 9, wAng, wAng + Math.PI * 2 * u.waveringCourage);
      }
    }

    // Fear ring
    if (u.fearBurst) {
      var pulse = 0.5 + 0.5 * Math.sin(gameTime * 10);
      g.lineStyle(2.5, 0xff3232, 0.5 + 0.4 * pulse);
      g.drawCircle(rx, ry, u.radius + 7);
    } else if (u.fearStack >= 2) {
      g.lineStyle(1.5, 0xffb400, 0.45);
      g.drawCircle(rx, ry, u.radius + 5);
    }

    // Block shield
    if (u.blockTimer > 0) {
      var ba = u.blockTimer / 0.35;
      g.lineStyle(3 * ba, 0x64c8ff, ba * 0.95);
      g.arc(rx, ry, u.radius + 5, -Math.PI * 0.75, Math.PI * 0.75);
    }

    // Stun stars / retreat arrow / split label
    if (u.stunTimer > 0) {
      for (var si = 0; si < 3; si++) {
        var ang = gameTime * 4 + si * Math.PI * 2 / 3;
        var sx2 = rx + Math.cos(ang) * (u.radius + 7);
        var sy2 = ry + Math.sin(ang) * (u.radius + 7);
        var st = _getWorldText();
        st.text = '★'; st.style.fontSize = 9; st.style.fill = 0xffee00;
        st.position.set(sx2, sy2);
      }
    } else if (u.retreating) {
      var rt = _getWorldText();
      rt.text = u.retreatBlocked ? '✖↩' : '↩';
      rt.style.fontSize = 11;
      rt.style.fill = u.retreatBlocked ? 0xff4444 : 0xffffff;
      rt.alpha = u.retreatBlocked ? 0.8 : 0.53;
      rt.position.set(rx, ry);
    }

    if (isSplit && u.team === 0) {
      var lt = _getWorldText();
      lt.text = u.group === 0 ? 'A' : 'B';
      lt.style.fontSize = 9;
      lt.style.fill = 0xffffff; lt.alpha = 0.4;
      lt.position.set(rx, ry - u.radius - 10);
    }
  });

  // ── HUD ─────────────────────────────────────────────────
  var hg = hudGfx;
  hg.clear();

  var t0 = teamAlive[0], t1 = teamAlive[1];
  var c0 = teamCamps[0], c1 = teamCamps[1];
  var total = camps.length;

  // Панель сверху
  hg.beginFill(0x000000, 0.6);
  hg.drawRect(0, 0, W, 34);
  hg.endFill();

  hudTxtBlue.text = '◉ ' + t0 + '  ⛺' + c0 + '/' + total;
  hudTxtBlue.position.set(10, 5);
  hudTxtRed.text  = '⛺' + c1 + '/' + total + '  ' + t1 + ' ◉';
  hudTxtRed.position.set(W - 10 - hudTxtRed.width, 5);
  hudTxtVs.position.set(W/2, 5);

  // Полоска стамины
  var blueUnits = units.filter(function(u){ return u.alive && u.team === 0; });
  if (blueUnits.length > 0) {
    var avgStam = blueUnits.reduce(function(s,u){ return s + (u.stamina||STAMINA_MAX); }, 0) / blueUnits.length;
    var stamRatio = avgStam / STAMINA_MAX;
    var barW = 80, barH = 4, barX = W/2 - barW/2, barY = 26;
    hg.beginFill(0xffffff, 0.15);
    hg.drawRect(barX, barY, barW, barH);
    hg.endFill();
    var stamC = stamRatio > 0.5 ? 0x44ddaa : stamRatio > 0.25 ? 0xffcc00 : 0xff4444;
    hg.beginFill(stamC, 1);
    hg.drawRect(barX, barY, barW * stamRatio, barH);
    hg.endFill();
  }

  // Индикатор спринта ⚡ и метки групп при сплите
  if (isSplit) {
    var spA = playerSprint[0], spB = playerSprint[1];
    hudTxtHint.text = (spA ? '⚡A' : 'A') + '  ·  ' + (spB ? 'B⚡' : 'B');
    hudTxtHint.style.fill = (spA || spB) ? 0xffee44 : 0xffffff;
    hudTxtHint.alpha = 0.6;
    hudTxtHint.position.set(W/2, 42);
  } else if (playerSprint[0]) {
    hudTxtHint.text = '⚡ СПРИНТ';
    hudTxtHint.style.fill = 0xffee44; hudTxtHint.alpha = 0.85;
    hudTxtHint.position.set(W/2, 42);
  } else if (gameTime < 6) {
    var hint = '1 палец — двигать  ·  2 пальца — разделить  ·  2× тап — спринт ⚡';
    var alpha = gameTime < 5 ? 0.75 : 0.75 * (1 - (gameTime - 5));
    hudTxtHint.text = hint;
    hudTxtHint.style.fill = 0xffffff; hudTxtHint.alpha = alpha;
    hudTxtHint.position.set(W/2, H - 14);
  } else {
    hudTxtHint.text = '';
  }

  // FPS + тайминги фаз
  hudTxtFps.text = _fps + 'fps u:' + aliveCount +
    ' | mv:' + _PT_avg.move + ' cb:' + _PT_avg.combat +
    ' ai:' + _PT_avg.ai + ' dr:' + _PT_avg.draw + 'ms';
  hudTxtFps.position.set(W - 4, H - 4);

  // Game over overlay
  if (gameOver) {
    hg.beginFill(0x000000, 0.72);
    hg.drawRect(0, H/2 - 60, W, 120);
    hg.endFill();
    hudTxtOver1.text = gameOver === 'blue' ? '🔵 Победа!' : '🔴 Победа!';
    hudTxtOver1.style.fill = gameOver === 'blue' ? 0x4488ff : 0xff4444;
    hudTxtOver1.position.set(W/2, H/2 - 8);
    hudTxtOver2.position.set(W/2, H/2 + 24);
    hudTxtOver1.visible = true; hudTxtOver2.visible = true;
  } else {
    hudTxtOver1.visible = false; hudTxtOver2.visible = false;
  }
}

// ── Loop ───────────────────────────────────────────────────
function updateCamera(dt) {
  // Следим за активными синими (не отступающими), иначе за всеми
  var blues = units.filter(function(u){ return u.alive && u.team === 0 && !u.retreating; });
  if (blues.length === 0) blues = units.filter(function(u){ return u.alive && u.team === 0; });
  if (blues.length > 0) {
    var cx = blues.reduce(function(s,u){return s+u.x;},0) / blues.length;
    var cy = blues.reduce(function(s,u){return s+u.y;},0) / blues.length;
    camTargetX = cx - W / (2*ZOOM);
    camTargetY = cy - H / (2*ZOOM);
  }
  camTargetX = Math.max(0, Math.min(MAP_W - W/ZOOM, camTargetX));
  camTargetY = Math.max(0, Math.min(MAP_H - H/ZOOM, camTargetY));
  // Плавное следование
  camX += (camTargetX - camX) * Math.min(1, dt * 7);
  camY += (camTargetY - camY) * Math.min(1, dt * 7);
}

function updateAI(dt) {
  aiTimer -= dt;
  aiModeTimer      = Math.max(0, aiModeTimer - dt);
  aiFocusSwitchTimer = Math.max(0, aiFocusSwitchTimer - dt);
  if (aiTimer > 0) return;
  aiTimer = AI_INTERVAL;

  // ── Все живые красные (активные и ждущие отдельно) ────────
  var redsAll = [], redsActive = [], blues = [];
  for (var _ai = 0; _ai < units.length; _ai++) {
    var _u = units[_ai];
    if (!_u.alive) continue;
    if (_u.team === 1) { redsAll.push(_u); if (!_u.waiting && !_u.isNeutral) redsActive.push(_u); }
    if (_u.team === 0) blues.push(_u);
  }
  if (redsActive.length === 0) return;

  // ── Центры масс групп ─────────────────────────────────────
  function centroid(arr) {
    var cx = 0, cy = 0;
    for (var _i = 0; _i < arr.length; _i++) { cx += arr[_i].x; cy += arr[_i].y; }
    return arr.length ? { x: cx / arr.length, y: cy / arr.length } : { x: MAP_W - 80, y: MAP_H / 2 };
  }

  var g0 = redsActive.filter(function(u) { return u.group === 0; });
  var g1 = redsActive.filter(function(u) { return u.group === 1; });
  var c0 = centroid(g0.length ? g0 : redsActive);
  var c1 = centroid(g1.length ? g1 : redsActive);
  var cAll = centroid(redsActive);

  // ── Виртуальная камера ИИ: следует за фокусной группой ────
  var focusCentroid = aiFocusGroup === 0 ? c0 : c1;
  aiFocusX += (focusCentroid.x - aiFocusX) * 0.5;
  aiFocusY += (focusCentroid.y - aiFocusY) * 0.5;

  // ── Видимые синие (в радиусе обзора от виртуальной камеры) ─
  var visBlues = blues.filter(function(u) {
    return Math.hypot(u.x - aiFocusX, u.y - aiFocusY) < AI_VIEW_RADIUS;
  });
  var ratio = redsActive.length / Math.max(1, blues.length);

  // ── Ближайший видимый синий к фокусной группе ─────────────
  var nearestBlue = null, nearestBlueDist = Infinity;
  for (var _b = 0; _b < visBlues.length; _b++) {
    var _d = Math.hypot(visBlues[_b].x - focusCentroid.x, visBlues[_b].y - focusCentroid.y);
    if (_d < nearestBlueDist) { nearestBlueDist = _d; nearestBlue = visBlues[_b]; }
  }

  // ── Анализ лагерей (только видимые или свои) ──────────────
  var raidTarget = null, raidScore = -Infinity;
  var campTarget = null, campDist = Infinity;
  for (var _c = 0; _c < camps.length; _c++) {
    var camp = camps[_c];
    var inView = Math.hypot(camp.x - aiFocusX, camp.y - aiFocusY) < AI_VIEW_RADIUS * 1.3;
    var isOwn  = camp.team === 1;
    if (!inView && !isOwn) continue;
    var guardCount = 0;
    forNearby(camp.x, camp.y, 120, function(_gu) {
      if (_gu.alive && _gu.team === 0) guardCount++;
    });
    if (camp.team === 0) {
      var _dist = Math.hypot(camp.x - cAll.x, camp.y - cAll.y);
      var score = -guardCount * 40 - _dist * 0.3;
      if (score > raidScore) { raidScore = score; raidTarget = camp; }
    } else if (camp.team !== 1) {
      var _cd = Math.hypot(camp.x - focusCentroid.x, camp.y - focusCentroid.y);
      if (_cd < campDist) { campDist = _cd; campTarget = camp; }
    }
  }

  // ── Фланговая точка ───────────────────────────────────────
  var bCentroid = centroid(visBlues.length ? visBlues : blues);
  var dx = bCentroid.x - focusCentroid.x, dy = bCentroid.y - focusCentroid.y;
  var dlen = Math.hypot(dx, dy) || 1;
  var perpX = -dy / dlen, perpY = dx / dlen;
  var flankX = Math.max(50, Math.min(MAP_W-50, bCentroid.x + perpX * 200));
  var flankY = Math.max(50, Math.min(MAP_H-50, bCentroid.y + perpY * 200));

  // ── Резервные лагеря красных ──────────────────────────────
  var rallyTarget = null, rallyDist = Infinity;
  var totalWaitingRed = 0;
  for (var _rw = 0; _rw < units.length; _rw++) {
    if (units[_rw].alive && units[_rw].team === 1 && units[_rw].waiting) totalWaitingRed++;
  }
  for (var _rc = 0; _rc < camps.length; _rc++) {
    var _rc2 = camps[_rc];
    if (_rc2.team !== 1) continue;
    var hasW = false;
    for (var _rr2 = 0; _rr2 < units.length; _rr2++) {
      if (units[_rr2].alive && units[_rr2].team === 1 && units[_rr2].waiting && units[_rr2].homecamp === _rc2) { hasW = true; break; }
    }
    if (hasW) {
      var _rd = Math.hypot(_rc2.x - cAll.x, _rc2.y - cAll.y);
      if (_rd < rallyDist) { rallyDist = _rd; rallyTarget = _rc2; }
    }
  }

  // ── Обновление вектора движения игрока ───────────────────
  var _pt = targets[0][0];
  var _pdx = _pt.x - _prevPlayerTarget.x, _pdy = _pt.y - _prevPlayerTarget.y;
  var _pdist = Math.hypot(_pdx, _pdy);
  if (_pdist > 10) { // игрок сменил цель
    _playerMoveVec.x = _pdx / _pdist;
    _playerMoveVec.y = _pdy / _pdist;
    _prevPlayerTarget.x = _pt.x; _prevPlayerTarget.y = _pt.y;
  }

  // Предсказываем угрозу лагерям: игрок идёт к лагерю ИИ?
  var interceptTarget = null, interceptScore = -Infinity;
  for (var _ic = 0; _ic < camps.length; _ic++) {
    var _icamp = camps[_ic];
    if (_icamp.team !== 1) continue;
    var _dtoCamp = Math.hypot(_pt.x - _icamp.x, _pt.y - _icamp.y);
    if (_dtoCamp > 500) continue; // слишком далеко
    // Проекция вектора движения игрока на направление к нашему лагерю
    var _dirX = (_icamp.x - _pt.x) / (_dtoCamp + 0.1);
    var _dirY = (_icamp.y - _pt.y) / (_dtoCamp + 0.1);
    var _dot = _playerMoveVec.x * _dirX + _playerMoveVec.y * _dirY;
    if (_dot > 0.55) { // игрок движется к нашему лагерю
      var _score = _dot * 100 - _dtoCamp * 0.2;
      if (_score > interceptScore) { interceptScore = _score; interceptTarget = _icamp; }
    }
  }
  // Точка перехвата: на полпути между текущей позицией игрока и лагерем
  var interceptPoint = null;
  if (interceptTarget) {
    interceptPoint = {
      x: (_pt.x + interceptTarget.x) / 2,
      y: (_pt.y + interceptTarget.y) / 2
    };
  }

  // ── Локальное соотношение ─────────────────────────────────
  var localBlues = 0;
  for (var _lb = 0; _lb < blues.length; _lb++) {
    if (Math.hypot(blues[_lb].x - cAll.x, blues[_lb].y - cAll.y) < 200) localBlues++;
  }
  var localRatio = redsActive.length / Math.max(1, localBlues);

  // ════════════════════════════════════════════════════════════
  // ── РЕШЕНИЕ О РАЗДЕЛЕНИИ / ОБЪЕДИНЕНИИ ────────────────────
  // ════════════════════════════════════════════════════════════
  var groupsDist = Math.hypot(c0.x - c1.x, c0.y - c1.y);

  // Объединяем если: мало юнитов, уступаем, группы уже рядом, или одна из групп пуста
  var shouldMerge = aiSplit && (
    redsActive.length < 6 ||
    ratio < 0.7 ||
    groupsDist < 80 ||
    g0.length === 0 || g1.length === 0
  );
  if (shouldMerge) {
    aiSplit = false;
    aiFocusGroup = 0;
    for (var _mg = 0; _mg < units.length; _mg++) {
      if (units[_mg].alive && units[_mg].team === 1) units[_mg].group = 0;
    }
  }

  // Разделяем если: достаточно юнитов, есть два разных объекта, режим не экстренный
  var canSplit = !aiSplit && redsActive.length >= 8 && ratio >= 0.9 && aiModeTimer <= 0;
  if (canSplit && campTarget && nearestBlue) {
    var campDir  = Math.hypot(campTarget.x - cAll.x, campTarget.y - cAll.y);
    var enemyDir = Math.hypot(nearestBlue.x - cAll.x, nearestBlue.y - cAll.y);
    // Цели в разных направлениях (угол > 60°)?
    var dotProd = ((campTarget.x - cAll.x) * (nearestBlue.x - cAll.x) +
                   (campTarget.y - cAll.y) * (nearestBlue.y - cAll.y)) /
                  (campDir * enemyDir + 0.001);
    if (dotProd < 0.5 && campDir > 100 && enemyDir > 80) {
      aiSplit = true;
      // Делим пополам: первая половина → группа 0, вторая → группа 1
      var _sa = redsActive.slice(); // копия
      _sa.forEach(function(u, i) { u.group = i < Math.ceil(_sa.length / 2) ? 0 : 1; });
      aiFocusGroup = 0;
      aiFocusSwitchTimer = AI_FOCUS_SWITCH_TIME;
      // Группа 1 сразу получает цель: лагерь
      targets[1][1] = { x: campTarget.x, y: campTarget.y };
    }
  }

  // ════════════════════════════════════════════════════════════
  // ── ПЕРЕКЛЮЧЕНИЕ ФОКУСА (только по таймеру) ───────────────
  // ════════════════════════════════════════════════════════════
  if (aiSplit && aiFocusSwitchTimer <= 0) {
    // Переключаем фокус на группу которая сейчас важнее
    var g0Score = 0, g1Score = 0;
    // Угроза синих поблизости
    for (var _fs = 0; _fs < blues.length; _fs++) {
      var _fd0 = Math.hypot(blues[_fs].x - c0.x, blues[_fs].y - c0.y);
      var _fd1 = Math.hypot(blues[_fs].x - c1.x, blues[_fs].y - c1.y);
      if (_fd0 < 150) g0Score += 2;
      if (_fd1 < 150) g1Score += 2;
    }
    // Маленькая группа требует внимания
    if (g0.length < g1.length) g0Score += 1;
    else g1Score += 1;

    var newFocus = g0Score >= g1Score ? 0 : 1;
    if (newFocus !== aiFocusGroup) {
      aiFocusGroup = newFocus;
      aiFocusSwitchTimer = AI_FOCUS_SWITCH_TIME;
    }
  }

  // ════════════════════════════════════════════════════════════
  // ── КОМАНДЫ ДЛЯ АКТИВНОЙ (ФОКУСНОЙ) ГРУППЫ ───────────────
  // ════════════════════════════════════════════════════════════
  var tx, ty, chosenMode;

  // Приоритет 1: СБОР РЕЗЕРВА
  if (rallyTarget && ratio < 0.75) {
    tx = rallyTarget.x; ty = rallyTarget.y;
    chosenMode = 'rally';
    aiTimer = 1.0;
    for (var _rv = 0; _rv < units.length; _rv++) {
      if (units[_rv].alive && units[_rv].team === 1 && !units[_rv].campGuard) {
        units[_rv].retreating = true;
        units[_rv]._retreatX = tx; units[_rv]._retreatY = ty;
      }
    }
  // Приоритет 2: ОТСТУПЛЕНИЕ (нет резерва)
  } else if (ratio < 0.5) {
    tx = MAP_W - 80; ty = MAP_H / 2;
    chosenMode = 'retreat';
    aiTimer = 1.5;
  // Приоритет 3: БЕГСТВО от локального превосходства
  } else if (localRatio < 0.65 && localBlues > 2 && aiModeTimer <= 0) {
    var escapeX = MAP_W - 80, escapeY = MAP_H / 2, escapeDist = Infinity;
    for (var _ec = 0; _ec < camps.length; _ec++) {
      if (camps[_ec].team !== 1) continue;
      var _ed = Math.hypot(camps[_ec].x - cAll.x, camps[_ec].y - cAll.y);
      if (_ed < escapeDist) { escapeDist = _ed; escapeX = camps[_ec].x; escapeY = camps[_ec].y; }
    }
    tx = escapeX; ty = escapeY;
    chosenMode = 'retreat';
    aiModeTimer = 4;
  // Приоритет 4: РЕЙД
  } else if (raidTarget && raidScore > -200 && ratio >= 0.85 && aiModeTimer <= 0) {
    tx = raidTarget.x; ty = raidTarget.y;
    chosenMode = 'raid';
    aiModeTimer = 6;
  // Приоритет 4.5: ПЕРЕХВАТ (игрок идёт к нашему лагерю → высылаем заслон)
  } else if (interceptPoint && ratio >= 0.8 && aiModeTimer <= 0) {
    if (aiSplit) {
      // В сплите: фокусная группа идёт на перехват, другая держит позицию
      tx = interceptPoint.x; ty = interceptPoint.y;
      chosenMode = 'intercept';
      aiModeTimer = 4;
    } else if (redsActive.length >= 6) {
      // Не в сплите и достаточно юнитов: разделяемся, одна группа — заслон
      aiSplit = true;
      var _isa = redsActive.slice();
      _isa.forEach(function(u, i) { u.group = i < Math.ceil(_isa.length / 2) ? 0 : 1; });
      aiFocusGroup = 0;
      aiFocusSwitchTimer = AI_FOCUS_SWITCH_TIME;
      // Группа 1 сразу идёт на перехват
      targets[1][1] = { x: interceptPoint.x, y: interceptPoint.y };
      tx = nearestBlue ? nearestBlue.x : interceptPoint.x;
      ty = nearestBlue ? nearestBlue.y : interceptPoint.y;
      chosenMode = 'intercept';
      aiModeTimer = 5;
    } else {
      // Мало юнитов — просто идём навстречу
      tx = interceptPoint.x; ty = interceptPoint.y;
      chosenMode = 'intercept';
      aiModeTimer = 3;
    }
  // Приоритет 5: ЗАХВАТ ЛАГЕРЯ
  } else if (campTarget && aiModeTimer <= 0) {
    if (nearestBlue && nearestBlueDist < 140 && ratio >= 1.4) {
      tx = nearestBlue.x; ty = nearestBlue.y; chosenMode = 'attack';
    } else {
      tx = campTarget.x; ty = campTarget.y; chosenMode = 'camp';
    }
  // Приоритет 6: ДОКОМПЛЕКТОВАНИЕ
  } else if (rallyTarget && totalWaitingRed > 0 && ratio < 1.1 && aiModeTimer <= 0) {
    tx = rallyTarget.x; ty = rallyTarget.y;
    chosenMode = 'rally'; aiModeTimer = 5;
  // Приоритет 7: ФЛАНГ
  } else if (nearestBlue && ratio >= 1.3 && aiModeTimer <= 0) {
    tx = flankX; ty = flankY;
    chosenMode = 'flank'; aiModeTimer = 5;
  // Приоритет 8: АТАКА
  } else if (nearestBlue) {
    tx = nearestBlue.x; ty = nearestBlue.y; chosenMode = 'attack';
  } else {
    tx = MAP_W - 150; ty = MAP_H / 2; chosenMode = 'idle';
  }

  aiMode = chosenMode;
  aiLog = 'AI[' + chosenMode + (aiSplit ? ' SPLIT:' + aiFocusGroup : '') + ']' +
          ' r=' + redsActive.length + '(+' + totalWaitingRed + 'w)' +
          ' b=' + blues.length + ' vis=' + visBlues.length +
          ' ratio=' + ratio.toFixed(1) +
          (interceptTarget ? ' INTCPT→' + interceptTarget.team : '');

  // Команда только активной группе (или обеим если не сплит)
  if (aiSplit) {
    targets[1][aiFocusGroup] = { x: tx, y: ty };
    // Неактивная группа держит свою цель (не перезаписываем)
  } else {
    targets[1][0] = { x: tx, y: ty };
    targets[1][1] = { x: tx, y: ty };
  }

  // Сбрасываем retreating если не отступаем
  if (chosenMode !== 'retreat' && chosenMode !== 'rally') {
    for (var _rr = 0; _rr < units.length; _rr++) {
      if (units[_rr].alive && units[_rr].team === 1 && !units[_rr].campGuard) {
        units[_rr].retreating = false;
      }
    }
  }
}

var gameTime = 0;
var _fpsFrames = 0, _fpsTime = 0, _fps = 0;
var _dbgEl = document.getElementById('dbg');
// Тайминги фаз (мс, скользящее среднее)
var _PT = { grid:0, move:0, combat:0, camps:0, ai:0, draw:0 };
var _PT_avg = { grid:0, move:0, combat:0, camps:0, ai:0, draw:0 };
var _ptFrames = 0;

function _phase(name, fn) {
  var t0 = performance.now();
  try { fn(); } catch(e) {
    _dbgEl.style.display = 'block';
    _dbgEl.textContent = name + ' ERR: ' + e.message + '\n' + (e.stack||'').slice(0,200);
    throw e; // остановить тикер
  }
  _PT[name] += performance.now() - t0;
}

app.ticker.add(function(pixiDelta) {
  var dt = Math.min(app.ticker.elapsedMS / 1000, 0.05);
  gameTime += dt;

  _fpsFrames++;
  _fpsTime += dt;
  _ptFrames++;

  if (!gameOver) {
    _phase('grid',   function(){ buildGrid(); });
    _phase('move',   function(){ updateMovement(dt); });
    _phase('grid',   function(){ buildGrid(); });
    _phase('combat', function(){ updateCombat(dt); });
    _phase('camps',  function(){ updateCamps(dt); });
    _phase('ai',     function(){ updateAI(dt); });
    try { checkVictory(); updateCamera(dt); } catch(e) {
      _dbgEl.style.display='block'; _dbgEl.textContent='vic/cam: '+e.message; return;
    }
  }

  var t0d = performance.now();
  try { draw(); } catch(e) {
    _dbgEl.style.display='block';
    _dbgEl.textContent='draw ERR: '+e.message+'\n'+(e.stack||'').slice(0,200);
    return;
  }
  _PT.draw += performance.now() - t0d;

  // Обновляем скользящее среднее раз в секунду
  if (_fpsTime >= 1.0) {
    _fps = Math.round(_fpsFrames / _fpsTime);
    var n = _ptFrames;
    for (var k in _PT) { _PT_avg[k] = Math.round(_PT[k] / n * 10) / 10; _PT[k] = 0; }
    _fpsFrames = 0; _fpsTime = 0; _ptFrames = 0;
  }
});

} // end initGame
}); // end window load
</script>
